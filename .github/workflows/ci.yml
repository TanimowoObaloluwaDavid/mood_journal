name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build

      - name: Check generated code is up to date
        # `app_database.g.dart` is committed so the repo works straight from a
        # clone. This catches someone editing tables.dart and forgetting to
        # regenerate, which would otherwise fail confusingly at runtime.
        run: |
          if ! git diff --quiet -- lib/data/local/app_database.g.dart; then
            echo "::error::lib/data/local/app_database.g.dart is out of date."
            echo "Run 'dart run build_runner build' and commit the result."
            git --no-pager diff -- lib/data/local/app_database.g.dart
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build

      # A debug APK proves the whole app — Android plugin registration, the
      # native SQLite bindings, tree-shaking of icons — actually links.
      - name: Build
        run: flutter build apk --debug
